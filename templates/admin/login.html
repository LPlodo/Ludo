<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
<meta
    name="csrf-token"
    content="{{ csrf_token() }}"
>
    <title>Lpdoplayer - Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin/login.css') }}"
    >

</head>


<body>


    <main class="login-container">


        <div class="login-card">


            <img
                src="{{ url_for('static', filename='images/lplogo.png') }}"
                class="login-logo"
                alt="Lpdoplayer"
            >


            <h1>
                Admin Login
            </h1>


            <p class="login-subtitle">
                Login to access the admin panel.
            </p>



            <!-- =========================
                 FLASH MESSAGES
            ========================== -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    <div class="flash-container">

                        {% for category, message in messages %}

                            <div class="flash-message {{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}



            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form
                method="POST"
                action="{{ url_for('admin.admin_login') }}"
            >


                <div class="input-group">

                    <label for="username">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>



                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


        </div>


    </main>

<script
    src="{{ url_for('static', filename='js/security.js') }}"
    defer
></script>
    <script>

        setTimeout(
            function () {

                document
                    .querySelectorAll(".flash-message")
                    .forEach(
                        function (message) {

                            message.remove();

                        }
                    );

            },
            5000
        );

    </script>


</body>

</html>
